<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G10 Adhésion — Validation Marie-Josée</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f8fb;color:#0b3558;display:grid;place-items:center;min-height:100vh}
.box{background:#fff;border:1px solid #dbe6ef;border-radius:18px;padding:28px;max-width:560px;box-shadow:0 14px 40px rgba(10,50,80,.08);text-align:center}
.spinner{width:42px;height:42px;border:4px solid #dbe6ef;border-top-color:#0e70b8;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
small{color:#6c8194}
</style>
</head>
<body>
<div class="box"><div class="spinner"></div><h2>Chargement de G10 Adhésion</h2><p>Version de validation Marie-Josée</p><small>Quelques secondes peuvent être nécessaires au premier chargement.</small></div>
<script>
(async()=>{
  try{
    if(location.search||location.hash){history.replaceState(null,'',location.pathname);}

    const base='/validation-marie-josee-v614-parts/';
    const urls=Array.from({length:51},(_,i)=>base+'part'+String(i).padStart(3,'0')+'.txt');
    const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()})));
    const partial=parts.join('');
    const marker='const OFFICIAL_DOCUMENTS';
    const cut=partial.indexOf(marker);
    if(cut<0) throw new Error('Point de reconstruction introuvable');
    const current=await fetch('/index.html?validation='+Date.now(),{cache:'no-store'}).then(r=>r.text());
    const tailStart=current.indexOf(marker);
    if(tailStart<0) throw new Error('Base applicative introuvable');
    let html=partial.slice(0,cut)+current.slice(tailStart);
    html=html.replace('<title>G10 Adhésion — Version de validation Marie-Josée</title>','<title>G10 Adhésion — Validation Marie-Josée</title>');

    const uiPatch=`<script id="marie-josee-login-ui-patch">
(function(){
  function normalizeMarieJoseeLogin(){
    var root=document.getElementById('landing')||document;
    var login=root.querySelector('button[onclick*="loginFromHome"]');
    var create=root.querySelector('button[onclick*="createAccountFromHome"]');
    if(login){login.textContent='Se connecter';}
    if(create){create.textContent='Créer un compte';}
    if(login&&create&&login.parentNode===create.parentNode&&login.nextElementSibling!==create){
      login.parentNode.insertBefore(login,create);
    }
    root.querySelectorAll('.g10-first-help').forEach(function(el){el.remove();});
    root.querySelectorAll('div,p,small').forEach(function(el){
      var t=(el.textContent||'').trim();
      if(t.indexOf('Première connexion ?')===0 && !el.querySelector('button')) el.remove();
    });
  }
  normalizeMarieJoseeLogin();
  document.addEventListener('DOMContentLoaded',normalizeMarieJoseeLogin);
  window.addEventListener('load',normalizeMarieJoseeLogin);
  setTimeout(normalizeMarieJoseeLogin,0);
  setTimeout(normalizeMarieJoseeLogin,300);
  setTimeout(normalizeMarieJoseeLogin,1200);
  var observer=new MutationObserver(function(){normalizeMarieJoseeLogin();});
  observer.observe(document.documentElement,{subtree:true,childList:true,characterData:true});
})();
<\/script>`;
    html=html.replace('</body>',uiPatch+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="box"><h2>Chargement impossible</h2><p>'+String(err.message||err)+'</p><p>Actualisez la page.</p></div>';
  }
})();
</script>
</body>
</html>
