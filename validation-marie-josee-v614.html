<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G10 Adhésion — Validation Marie-Josée</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#0b355a}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:1px solid #dce5ef;border-radius:20px;padding:28px 34px;box-shadow:0 16px 45px rgba(13,68,111,.12);text-align:center;max-width:560px}
.spin{width:44px;height:44px;border:4px solid #dce5ef;border-top-color:#0d6fb8;border-radius:50%;margin:0 auto 18px;animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}} .muted{color:#65778c}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="spin"></div><h2>Chargement de G10 Adhésion</h2><p class="muted">Version de validation Marie-Josée</p></div></div>
<script>
(async()=>{
  try{
    if(location.search||location.hash) history.replaceState(null,'',location.pathname);
    const base='/validation-marie-josee-exact/';
    const urls=Array.from({length:35},(_,i)=>base+'part'+String(i).padStart(3,'0')+'.txt');
    const parts=await Promise.all(urls.map(async u=>{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error('Chargement impossible : '+u+' ('+r.status+')');
      return r.text();
    }));
    const html=parts.join('');
    if(!html.startsWith('<!doctype html>')||!html.includes('G10 Adhésion — Version de validation Marie-Josée')){
      throw new Error('La version de validation n’a pas pu être vérifiée.');
    }
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="wrap"><div class="card"><h2>Chargement impossible</h2><p>'+String(err.message||err)+'</p><p class="muted">Actualisez la page.</p></div></div>';
  }
})();
</script>
</body>
</html>
